services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migration:/docker-entrypoint-initdb.d/
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yakutsk"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey_cache
    ports:
      - "6380:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flommerce_backend
    env_file:
      - ./.env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    ports:
      - "8080:8080"
    volumes:
      - server_logs:/home/yakutsk/Public/Project-Logs/E-Commerce
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: flommerce_frontend
  #   env_file:
  #     - ./.env
  #   environment:
  #     - FRONTEND_HOST=0.0.0.0
  #     - FRONTEND_PORT=3000
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: flommerce_nginx
    volumes:
      - ./nginx/flommerce.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8900:80"
    depends_on:
      - backend
      # - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  server_logs: